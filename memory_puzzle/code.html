<script>
        document.addEventListener('DOMContentLoaded', () => {
            const board = document.getElementById('puzzle-board');
            const size = 3;
            let pieces = [];
            const emptyPos = { row: size - 1, col: size - 1 };
            
            // Initialize puzzle
            function initPuzzle() {
                let count = 0;
                for (let r = 0; r < size; r++) {
                    for (let c = 0; c < size; c++) {
                        if (r === size - 1 && c === size - 1) {
                            // Empty slot
                            const emptyDiv = document.createElement('div');
                            emptyDiv.className = 'empty-slot';
                            emptyDiv.dataset.row = r;
                            emptyDiv.dataset.col = c;
                            board.appendChild(emptyDiv);
                            pieces.push(null);
                        } else {
                            const piece = document.createElement('div');
                            piece.className = 'puzzle-piece';
                            piece.dataset.row = r;
                            piece.dataset.col = c;
                            piece.dataset.correctRow = r;
                            piece.dataset.correctCol = c;
                            
                            // Set background position
                            const x = c * (100 / (size - 1));
                            const y = r * (100 / (size - 1));
                            piece.style.backgroundPosition = `${x}% ${y}%`;
                            
                            piece.addEventListener('click', () => movePiece(piece));
                            board.appendChild(piece);
                            pieces.push(piece);
                        }
                    }
                }
                shuffle();
            }

            function getIndex(r, c) {
                return r * size + c;
            }

            function movePiece(piece) {
                const r = parseInt(piece.dataset.row);
                const c = parseInt(piece.dataset.col);
                
                // Check if adjacent to empty
                if ((Math.abs(r - emptyPos.row) === 1 && c === emptyPos.col) || 
                    (Math.abs(c - emptyPos.col) === 1 && r === emptyPos.row)) {
                    
                    // Swap logic in DOM grid (simplified by reordering based on data attributes)
                    // For a pure CSS grid, we just swap grid areas or re-render based on an array
                    const pieceIndex = pieces.indexOf(piece);
                    const emptyIndex = getIndex(emptyPos.row, emptyPos.col);
                    
                    // Update dataset
                    piece.dataset.row = emptyPos.row;
                    piece.dataset.col = emptyPos.col;
                    
                    emptyPos.row = r;
                    emptyPos.col = c;
                    
                    // Update array and DOM order
                    renderBoard();
                    checkWin();
                }
            }

            function shuffle() {
                // Simple shuffle by making random valid moves
                for (let i = 0; i < 100; i++) {
                    const validMoves = [];
                    pieces.forEach(p => {
                        if(p) {
                            const r = parseInt(p.dataset.row);
                            const c = parseInt(p.dataset.col);
                            if ((Math.abs(r - emptyPos.row) === 1 && c === emptyPos.col) || 
                                (Math.abs(c - emptyPos.col) === 1 && r === emptyPos.row)) {
                                validMoves.push(p);
                            }
                        }
                    });
                    const randomMove = validMoves[Math.floor(Math.random() * validMoves.length)];
                    if(randomMove) {
                        const r = parseInt(randomMove.dataset.row);
                        const c = parseInt(randomMove.dataset.col);
                        randomMove.dataset.row = emptyPos.row;
                        randomMove.dataset.col = emptyPos.col;
                        emptyPos.row = r;
                        emptyPos.col = c;
                    }
                }
                renderBoard();
            }

            function renderBoard() {
                // Sort pieces based on current row/col and append to board
                const allNodes = Array.from(board.children);
                allNodes.sort((a, b) => {
                    const aRow = a.dataset.row !== undefined ? parseInt(a.dataset.row) : emptyPos.row;
                    const aCol = a.dataset.col !== undefined ? parseInt(a.dataset.col) : emptyPos.col;
                    const bRow = b.dataset.row !== undefined ? parseInt(b.dataset.row) : emptyPos.row;
                    const bCol = b.dataset.col !== undefined ? parseInt(b.dataset.col) : emptyPos.col;
                    
                    return (aRow * size + aCol) - (bRow * size + bCol);
                });
                
                allNodes.forEach(node => board.appendChild(node));
            }

            function checkWin() {
                let isWin = true;
                const domPieces = board.querySelectorAll('.puzzle-piece');
                domPieces.forEach(p => {
                    if (p.dataset.row !== p.dataset.correctRow || p.dataset.col !== p.dataset.correctCol) {
                        isWin = false;
                    }
                });

                if (isWin) {
                    triggerWinState();
                }
            }

            function triggerWinState() {
                // Show original image fully
                board.innerHTML = `<img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCuWLdnA4DPn9IdTy6YbfbmL42Z9NhJ_8dZ9YhSp6ASlxqKr8Hy2f2wPw6flcjgyiXRWOTqO_2LPV5Bno8PP9VPmlTuoYrHFRAMMsptWuKk3-RA_6bDtYWhvhy3diSxkOebuodLWOVpqspALKrrMOaPYp3q4-B5qjaW9oaUjggxltejP4rVGuaq87YGkSmV9TshDAJ9K6mqVvl-MIazjDxUw1Od008IgV044aY1eP1ZKZ8tkqQPNunG" class="w-full h-full object-cover" />`;
                
                const successState = document.getElementById('success-state');
                successState.classList.remove('hidden');
                setTimeout(() => {
                    successState.classList.remove('opacity-0');
                    successState.classList.add('opacity-100');
                }, 100);

                const nextBtn = document.getElementById('next-btn');
                nextBtn.disabled = false;
                nextBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant', 'cursor-not-allowed');
                nextBtn.classList.add('bg-gradient-to-r', 'from-primary', 'to-secondary', 'text-on-primary', 'shadow-md', 'hover:scale-105', 'cursor-pointer');
                
                fireConfetti();
            }

            // Hint logic
            const hintBtn = document.getElementById('hint-btn');
            const hintImg = document.getElementById('hint-img-container');
            hintBtn.addEventListener('click', () => {
                hintImg.classList.toggle('hidden');
                setTimeout(() => {
                    hintImg.classList.toggle('opacity-0');
                    hintImg.classList.toggle('opacity-100');
                }, 10);
            });

            // Simple Confetti
            function fireConfetti() {
                const canvas = document.getElementById('confetti-canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                const particles = [];
                const colors = ['#f4c2c2', '#ffb2bc', '#7b5455', '#f1cb00'];

                for (let i = 0; i < 100; i++) {
                    particles.push({
                        x: canvas.width / 2,
                        y: canvas.height / 2,
                        r: Math.random() * 6 + 2,
                        dx: Math.random() * 10 - 5,
                        dy: Math.random() * -10 - 5,
                        color: colors[Math.floor(Math.random() * colors.length)]
                    });
                }

                function animate() {
                    requestAnimationFrame(animate);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach((p, index) => {
                        p.x += p.dx;
                        p.y += p.dy;
                        p.dy += 0.2; // gravity
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.fill();
                        
                        if(p.y > canvas.height) particles.splice(index, 1);
                    });
                }
                animate();
            }

            initPuzzle();
        });
    </script>
