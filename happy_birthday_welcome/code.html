<!-- Background Shader -->
<div class="fixed inset-0 z-0">
<!-- STITCH_SHADER_START:ANIMATION_3 class="absolute inset-0 w-full h-full opacity-60" -->
<div class="absolute inset-0 w-full h-full opacity-60" style="display:block;">
<canvas id="shader-canvas-ANIMATION_3" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_3');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;

void main() {
    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
    float color = 0.0;
    
    // Simple festive "shimmer" effect
    color += sin(uv.x * 10.0 + u_time) * 0.1;
    color += cos(uv.y * 10.0 + u_time) * 0.1;
    
    vec3 background = vec3(0.98, 0.95, 0.96); // Soft cream pink
    vec3 accent = vec3(0.95, 0.76, 0.76); // Rose gold tint
    
    gl_FragColor = vec4(mix(background, accent, color + 0.1), 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<!-- Confetti Container -->
<div class="fixed inset-0 pointer-events-none z-20 overflow-hidden" id="confetti-container"></div>
<script>
        // Music Toggle Logic
        const musicToggle = document.getElementById('music-toggle');
        const musicIcon = musicToggle.querySelector('span');
        let isPlaying = false;

        musicToggle.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if(isPlaying) {
                musicIcon.textContent = 'volume_up';
            } else {
                musicIcon.textContent = 'music_note';
            }
        });

        // Fade out transition
        const startBtn = document.getElementById('start-btn');
        const mainBody = document.getElementById('main-body');

        startBtn.addEventListener('click', (e) => {
            e.preventDefault();
            mainBody.classList.add('fade-out');
            // Simulate navigation after fade
            setTimeout(() => {
                console.log('Navigating to next page...');
            }, 1000);
        });

        // Simple Confetti
        const colors = ['#f4c2c2', '#ffb2bc', '#ffd9dd', '#ffe16d'];
        const container = document.getElementById('confetti-container');

        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti-piece');
            
            // Random styling
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
            
            // Random animation duration
            const duration = Math.random() * 3 + 2;
            confetti.style.animation = `fall ${duration}s linear forwards`;
            
            container.appendChild(confetti);
            
            // Remove after animation
            setTimeout(() => {
                confetti.remove();
            }, duration * 1000);
        }

        // CSS for falling confetti injected dynamically
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fall {
                to {
                    transform: translateY(100vh) rotate(720deg);
                }
            }
            @keyframes shimmer {
                100% {
                    transform: translateX(100%);
                }
            }
        `;
        document.head.appendChild(style);

        // Generate confetti periodically
        setInterval(createConfetti, 300);
        // Initial burst
        for(let i=0; i<20; i++) setTimeout(createConfetti, i*50);

    </script>
